name: Build MRS, SRS and Geosite Rule-Set

on:
  push:
    branches:
      - main
      - master
    paths:
      - '*.yaml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python & Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.22'

      - name: Setup Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyyaml

      - name: Setup Mihomo
        run: |
          MIHOMO_VERSION=$(curl -sL "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          wget -O mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/

      - name: Setup sing-box
        run: |
          SINGBOX_TAG=$(curl -sL "https://api.github.com/repos/SagerNet/sing-box/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          SINGBOX_VERSION="${SINGBOX_TAG#v}"
          wget -O sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${SINGBOX_TAG}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/
          rm -rf sing-box*

      - name: Convert YAML to MRS, SRS and List
        run: |
          mkdir -p publish
          mkdir -p geosite-data # 存放准备编译成 geosite 的文本目录

          # 生成辅助转换脚本
          cat << 'EOF' > convert_rules.py
          import sys, os, subprocess, yaml, json

          def main():
              input_yaml = sys.argv[1]
              tag_name = sys.argv[2] # 例如 direct, proxy, reject
              behavior = sys.argv[3] if len(sys.argv) > 3 else "domain"

              if not os.path.exists(input_yaml):
                  return

              with open(input_yaml, 'r', encoding='utf-8') as f:
                  data = yaml.safe_load(f)
              payload = data.get('payload', []) if isinstance(data, dict) else (data or [])

              domain, domain_suffix, domain_keyword, domain_regex, ip_cidr = [], [], [], [], []
              geosite_lines = []

              for item in payload:
                  if not item or not isinstance(item, str): continue
                  line = item.strip()
                  if not line or line.startswith('#'): continue

                  parts = [p.strip() for p in line.split(',')]
                  if len(parts) >= 2 and parts[0].upper() in ('DOMAIN', 'DOMAIN-SUFFIX', 'DOMAIN-KEYWORD', 'DOMAIN-REGEX', 'IP-CIDR', 'IP-CIDR6'):
                      rule_type, val = parts[0].upper(), parts[1]
                      if rule_type == 'DOMAIN':
                          domain.append(val)
                          geosite_lines.append(f"full:{val}")
                      elif rule_type == 'DOMAIN-SUFFIX':
                          val_clean = val.lstrip('.')
                          domain_suffix.append(val_clean)
                          geosite_lines.append(val_clean)
                      elif rule_type == 'DOMAIN-KEYWORD':
                          domain_keyword.append(val)
                          geosite_lines.append(f"keyword:{val}")
                      elif rule_type == 'DOMAIN-REGEX':
                          domain_regex.append(val)
                          geosite_lines.append(f"regexp:{val}")
                      elif rule_type in ('IP-CIDR', 'IP-CIDR6'):
                          ip_cidr.append(val)
                  else:
                      if behavior == 'ipcidr' or '/' in line:
                          ip_cidr.append(line.split(',')[0].strip())
                      else:
                          val_clean = line.lstrip('+').lstrip('.')
                          domain_suffix.append(val_clean)
                          geosite_lines.append(val_clean)

              # 1. 编译 sing-box SRS
              output_srs = f"publish/{tag_name}.srs"
              headless_rule = {}
              if domain: headless_rule['domain'] = list(dict.fromkeys(domain))
              if domain_suffix: headless_rule['domain_suffix'] = list(dict.fromkeys(domain_suffix))
              if domain_keyword: headless_rule['domain_keyword'] = list(dict.fromkeys(domain_keyword))
              if domain_regex: headless_rule['domain_regex'] = list(dict.fromkeys(domain_regex))
              if ip_cidr: headless_rule['ip_cidr'] = list(dict.fromkeys(ip_cidr))

              ruleset = {"version": 2, "rules": [headless_rule] if headless_rule else []}
              temp_json = f"{output_srs}.temp.json"
              with open(temp_json, 'w', encoding='utf-8') as f:
                  json.dump(ruleset, f, indent=2, ensure_ascii=False)
              subprocess.run(["sing-box", "rule-set", "compile", temp_json, "-o", output_srs], check=True)
              if os.path.exists(temp_json): os.remove(temp_json)

              # 2. 输出供 geosite 编译的文件 (仅针对域名集合)
              if geosite_lines:
                  geosite_file = os.path.join("geosite-data", tag_name.replace("domain-", "").replace("-rules", ""))
                  with open(geosite_file, 'w', encoding='utf-8') as f:
                      f.write("\n".join(dict.fromkeys(geosite_lines)) + "\n")

          if __name__ == '__main__':
              main()
          EOF

          # 转换 ip-direct-rules.yaml
          if [ -f "ip-direct-rules.yaml" ]; then
            mihomo convert-ruleset ipcidr yaml ip-direct-rules.yaml publish/ip-direct-rules.mrs
            python3 convert_rules.py ip-direct-rules.yaml ip-direct-rules ipcidr
            grep -E "^ *-" ip-direct-rules.yaml | sed -e "s/^ *- *//" -e "s/['\"]//g" -e "s/ *#.*//g" > publish/ip-direct-rules.list
          fi

          # 转换 domain-direct-rules.yaml
          if [ -f "domain-direct-rules.yaml" ]; then
            mihomo convert-ruleset domain yaml domain-direct-rules.yaml publish/domain-direct-rules.mrs
            python3 convert_rules.py domain-direct-rules.yaml domain-direct-rules domain
            grep -E "^ *-" domain-direct-rules.yaml | sed -e "s/^ *- *//" -e "s/['\"]//g" -e "s/ *#.*//g" > publish/domain-direct-rules.list
          fi

          # 转换 domain-reject-rules.yaml
          if [ -f "domain-reject-rules.yaml" ]; then
            mihomo convert-ruleset domain yaml domain-reject-rules.yaml publish/domain-reject-rules.mrs
            python3 convert_rules.py domain-reject-rules.yaml domain-reject-rules domain
            grep -E "^ *-" domain-reject-rules.yaml | sed -e "s/^ *- *//" -e "s/['\"]//g" -e "s/ *#.*//g" > publish/domain-reject-rules.list
          fi

          # 转换 domain-proxy-rules.yaml
          if [ -f "domain-proxy-rules.yaml" ]; then
            mihomo convert-ruleset domain yaml domain-proxy-rules.yaml publish/domain-proxy-rules.mrs
            python3 convert_rules.py domain-proxy-rules.yaml domain-proxy-rules domain
            grep -E "^ *-" domain-proxy-rules.yaml | sed -e "s/^ *- *//" -e "s/['\"]//g" -e "s/ *#.*//g" > publish/domain-proxy-rules.list
          fi

          # 下载并转换在线 AWAvenue-Ads-Rule 规则
          curl -sSL "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.yaml" -o awavenue-ads.yaml
          if [ -f "awavenue-ads.yaml" ]; then
            mihomo convert-ruleset domain yaml awavenue-ads.yaml publish/awavenue-ads.mrs
            python3 convert_rules.py awavenue-ads.yaml awavenue-ads domain
            grep -E "^ *-" awavenue-ads.yaml | sed -e "s/^ *- *//" -e "s/['\"]//g" -e "s/ *#.*//g" > publish/awavenue-ads.list
            rm -f awavenue-ads.yaml
          fi

          rm -f convert_rules.py

      # ===== 核心新增：编译自定义 geosite.dat =====
      - name: Build Custom geosite.dat
        run: |
          # 克隆官方编译器
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git compiler
          cd compiler

          # 【选项 A：自用轻量版】仅打包自己 geosite-data 里的 tag
          go run ./ --datapath=../geosite-data --outputname=../publish/geosite.dat

          # -------------------------------------------------------------
          # 【选项 B：全量增强版（可选）】如果你想保留官方所有标签 (如 cn, google 等)，
          # 同时把你自己的直连/代理/拦截覆盖进去，只需将自建文件拷贝进官方 data 目录：
          # cp -rf ../geosite-data/* ./data/
          # go run ./ --datapath=./data --outputname=../publish/geosite.dat
          # -------------------------------------------------------------

          cd ..
          rm -rf compiler geosite-data

      - name: Publish to release branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: release
          force_orphan: true
          commit_message: "Auto build mrs, srs, list and custom geosite.dat"
