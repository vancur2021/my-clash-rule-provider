name: Build MRS Rule-Set

on:
  push:
    branches:
      - main
      - master
    paths:
      - '*.yaml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0:00 自动触发更新在线规则编译

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Mihomo
        run: |
          MIHOMO_VERSION=$(curl -sL "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          wget -O mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/

      - name: Convert YAML to MRS and List
        run: |
          mkdir -p publish

          # 转换 ip-direct-rules.yaml (behavior: ipcidr)
          if [ -f "ip-direct-rules.yaml" ]; then
            mihomo convert-ruleset ipcidr yaml ip-direct-rules.yaml publish/ip-direct-rules.mrs
            # 提取纯文本列表生成 .list
            grep -E "^ *-" ip-direct-rules.yaml | sed -e "s/^ *- *//" -e "s/['\"]//g" -e "s/ *#.*//g" > publish/ip-direct-rules.list
          fi

          # 转换 domain-direct-rules.yaml (behavior: domain)
          if [ -f "domain-direct-rules.yaml" ]; then
            mihomo convert-ruleset domain yaml domain-direct-rules.yaml publish/domain-direct-rules.mrs
            grep -E "^ *-" domain-direct-rules.yaml | sed -e "s/^ *- *//" -e "s/['\"]//g" -e "s/ *#.*//g" > publish/domain-direct-rules.list
          fi

          # 转换 domain-reject-rules.yaml (behavior: domain)
          if [ -f "domain-reject-rules.yaml" ]; then
            mihomo convert-ruleset domain yaml domain-reject-rules.yaml publish/domain-reject-rules.mrs
            grep -E "^ *-" domain-reject-rules.yaml | sed -e "s/^ *- *//" -e "s/['\"]//g" -e "s/ *#.*//g" > publish/domain-reject-rules.list
          fi

          # 转换 domain-proxy-rules.yaml (behavior: domain)
          if [ -f "domain-proxy-rules.yaml" ]; then
            mihomo convert-ruleset domain yaml domain-proxy-rules.yaml publish/domain-proxy-rules.mrs
            grep -E "^ *-" domain-proxy-rules.yaml | sed -e "s/^ *- *//" -e "s/['\"]//g" -e "s/ *#.*//g" > publish/domain-proxy-rules.list
          fi

          # 下载并转换在线 AWAvenue-Ads-Rule 规则 (behavior: domain)
          curl -sSL "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.yaml" -o awavenue-ads.yaml
          if [ -f "awavenue-ads.yaml" ]; then
            mihomo convert-ruleset domain yaml awavenue-ads.yaml publish/awavenue-ads.mrs
            grep -E "^ *-" awavenue-ads.yaml | sed -e "s/^ *- *//" -e "s/['\"]//g" -e "s/ *#.*//g" > publish/awavenue-ads.list
            rm -f awavenue-ads.yaml
          fi

      - name: Publish to release branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: release
          force_orphan: true
          commit_message: "Auto build mrs and list files"
